<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
  <rect width="900" height="290" rx="10" fill="#0d1117"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="24" fill="#8b949e" text-anchor="middle">TenantIsolationIT › tenantsCannotSeeEachOther</text>
  <g fill="#c9d1d9">
    <text x="24" y="58"><tspan fill="#ff7b72">java.lang.AssertionError:</tspan> Tenant isolation scan: 3 of 5 GET endpoint(s) failed</text>
    <text x="24" y="76">for tenant B against tenant A's data (3 LEAK)</text>

    <text x="40" y="104" fill="#8b949e">VERDICT</text>
    <text x="130" y="104" fill="#8b949e">ENDPOINT</text>
    <text x="320" y="104" fill="#8b949e">STATUS</text>
    <text x="390" y="104" fill="#8b949e">NOTE</text>

    <text x="40" y="130" fill="#ff7b72" font-weight="bold">LEAK</text>
    <text x="130" y="130">GET /invoices</text>
    <text x="320" y="130">200</text>
    <text x="390" y="130">response changed after A's data was added: $.size</text>
    <text x="390" y="148" fill="#8b949e">observer: invoice rows of tenant A read</text>

    <text x="40" y="176" fill="#ff7b72" font-weight="bold">LEAK</text>
    <text x="130" y="176">GET /invoices/{id}</text>
    <text x="320" y="176">200</text>
    <text x="390" y="176">200 for tenant A's /invoices/3</text>
    <text x="390" y="194" fill="#8b949e">observer: invoice rows of tenant A read (by id)</text>

    <text x="40" y="222" fill="#ff7b72" font-weight="bold">LEAK</text>
    <text x="130" y="222">GET /reports/total</text>
    <text x="320" y="222">200</text>
    <text x="390" y="222">response changed after A's data was added: $.total</text>
    <text x="390" y="240" fill="#8b949e">observer: invoice rows of tenant A read by sum(amount)</text>

    <text x="40" y="270" fill="#3fb950">CLEAN</text>
    <text x="130" y="270">GET /my/invoices, GET /my/invoices/{id}</text>
    <text x="500" y="270" fill="#8b949e">(2 not failing)</text>
  </g>
</svg>
