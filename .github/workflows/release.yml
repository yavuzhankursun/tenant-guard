name: Release

# Tag vX.Y.Z (matching a non-SNAPSHOT <version>) -> tests, signed sources/javadoc/jar uploaded to the
# Maven Central Portal (autoPublish off: publish or drop the deployment by hand at
# https://central.sonatype.com/publishing/deployments), then a draft GitHub release with the jars.
# Manual dispatch with dry_run (the default) builds, tests and signs only: a check of the secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and sign only; no upload to Central, no GitHub release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Before anything else: without these the job must not build half a release.
      - name: Check release secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          missing=()
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release secrets missing::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions. Nothing was built, signed or uploaded."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No dependency cache on purpose: a release resolves its build from Maven Central, not from a
      # cache another workflow run could have written.
      # server-username/-password and gpg-passphrase name environment variables, which settings.xml
      # references as ${env.NAME}; the values are only set on the steps that need them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(mvn -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pom version: $version, ref: $REF_TYPE $REF_NAME, dry run: ${DRY_RUN:-false}"
          if [ "$DRY_RUN" = "true" ]; then exit 0; fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error title=SNAPSHOT version::pom.xml has $version. Set the release version, commit, then tag v<version>."
              exit 1 ;;
          esac
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error title=Tag does not match pom::A release runs from tag v$version (got $REF_TYPE $REF_NAME). Use dry_run to test from a branch."
            exit 1
          fi

      - name: Test
        run: mvn -B --no-transfer-progress verify

      - name: Sign (dry run)
        if: inputs.dry_run
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -Prelease -DskipTests verify

      - name: Deploy to the Central Portal
        if: ${{ !inputs.dry_run }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: mvn -B --no-transfer-progress -Prelease -DskipTests deploy

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            target/tenant-guard-*.jar
            target/tenant-guard-*.asc
          if-no-files-found: error

  github-release:
    needs: publish
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist
      # A draft, like the Central deployment: publish both once the Central one is live.
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "tenant-guard $VERSION" "${notes[@]}"
          fi
