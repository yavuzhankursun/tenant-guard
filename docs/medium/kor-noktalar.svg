<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#24292f">33 sızıntı kalıbı, üç katman</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#57606a">Her satır B kiracısı olarak koşan bir test; beklenti testte yazılı</text>

  <g font-size="15" font-weight="700" fill="#57606a">
    <text x="40" y="118">Kalıp</text>
    <text x="640" y="118" text-anchor="middle">Gözlemci</text>
    <text x="760" y="118" text-anchor="middle">Pasif kural</text>
    <text x="890" y="118" text-anchor="middle">Önce/sonra farkı</text>
  </g>
  <line x1="30" y1="132" x2="970" y2="132" stroke="#d0d7de"/>

  <g font-size="15" fill="#24292f">
    <text x="40" y="166">JPQL, native, JdbcTemplate, SUM/COUNT/MAX/MIN, CTE,</text>
    <text x="40" y="186">Criteria, Specification, @Async, readOnly ... (23 kalıp)</text>
    <text x="40" y="236">findById(A'nın id'si), IN (A'nın id'leri)</text>
    <text x="40" y="286">Doğru yazılmış JOIN (alt tablo üst tablodan filtrelenir)</text>
    <text x="40" y="336">EXISTS ... WHERE name = ? (cevap A'ya bağlı değil)</text>
    <text x="40" y="386">@Cacheable (baseline cache'i ısıttıktan sonra)</text>
    <text x="40" y="436">security_invoker olmayan view</text>
    <text x="40" y="486">SECURITY DEFINER fonksiyon</text>
  </g>
  <g stroke="#eaeef2"><line x1="30" y1="206" x2="970" y2="206"/><line x1="30" y1="256" x2="970" y2="256"/><line x1="30" y1="306" x2="970" y2="306"/><line x1="30" y1="356" x2="970" y2="356"/><line x1="30" y1="406" x2="970" y2="406"/><line x1="30" y1="456" x2="970" y2="456"/></g>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <!-- row 1 -->
    <text x="640" y="178" fill="#1a7f37">yakalar</text><text x="760" y="178" fill="#1a7f37">yakalar</text><text x="890" y="178" fill="#cf222e">LEAK</text>
    <!-- row 2 -->
    <text x="640" y="236" fill="#1a7f37">yakalar</text><text x="760" y="236" fill="#8c959f">sessiz</text><text x="890" y="236" fill="#cf222e">LEAK</text>
    <!-- row 3 -->
    <text x="640" y="286" fill="#bf8700">yanlış alarm</text><text x="760" y="286" fill="#bf8700">yanlış alarm</text><text x="890" y="286" fill="#1a7f37">CLEAN</text>
    <!-- row 4 -->
    <text x="640" y="336" fill="#8c959f">kör</text><text x="760" y="336" fill="#8c959f">kör</text><text x="890" y="336" fill="#8c959f">CLEAN</text>
    <!-- row 5 -->
    <text x="640" y="386" fill="#8c959f">kör</text><text x="760" y="386" fill="#8c959f">kör</text><text x="890" y="386" fill="#8c959f">CLEAN*</text>
    <!-- row 6 -->
    <text x="640" y="436" fill="#8c959f">kör</text><text x="760" y="436" fill="#8c959f">kör</text><text x="890" y="436" fill="#cf222e">LEAK</text>
    <!-- row 7 -->
    <text x="640" y="486" fill="#8c959f">kör</text><text x="760" y="486" fill="#8c959f">kör</text><text x="890" y="486" fill="#cf222e">LEAK</text>
  </g>
  <text x="500" y="536" text-anchor="middle" font-size="14" fill="#57606a">Gri: kanıtlanmış kör nokta (mekanizması ayrı testte).  * Kurban seed edildikten sonra cache temizlenirse LEAK.</text>
</svg>
